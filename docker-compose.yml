services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diffhive
      POSTGRES_USER: diffhive
      POSTGRES_PASSWORD: diffhive-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffhive"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  diffhive:
    build: .
    ports:
      - "8080:8080"
    environment:
      DIFFHIVE_HOST: 0.0.0.0
      DIFFHIVE_DATABASE_URL: postgresql://diffhive:diffhive-local@postgres:5432/diffhive
      DIFFHIVE_REDIS_URL: redis://redis:6379/0
      DIFFHIVE_ASYNC_WORKERS: 4
      DIFFHIVE_SKILLS_DIR: /app/skills
      DIFFHIVE_AUTH_REQUIRED: "true"
      DIFFHIVE_AUTH_SECRET: ${DIFFHIVE_AUTH_SECRET:-local-only-change-this-secret-123456}
      DIFFHIVE_BOOTSTRAP_ADMIN_USERNAME: ${DIFFHIVE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      DIFFHIVE_BOOTSTRAP_ADMIN_PASSWORD: ${DIFFHIVE_BOOTSTRAP_ADMIN_PASSWORD:-diffhive-local-admin}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
